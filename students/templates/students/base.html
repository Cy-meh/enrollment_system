<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Online Enrollment System{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      font-family: 'Inter', system-ui, sans-serif; color: #1e293b;
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 45%, #1d93e8 100%);
      background-attachment: fixed;
    }
    body.center { display: flex; align-items: center; justify-content: center; }
    a { color: inherit; text-decoration: none; }

    .card { background: #fff; border-radius: 16px; box-shadow: 0 20px 50px rgba(15, 23, 42, .25); }
    .logo { width: 48px; height: 48px; border-radius: 12px; background: #4f46e5; color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; }
    .logo.sm { width: 34px; height: 34px; font-size: 15px; border-radius: 9px; }

    .btn { display: block; width: 100%; padding: 12px 16px; border-radius: 10px; font: inherit;
           font-weight: 600; font-size: 14px; text-align: center; cursor: pointer; border: 1px solid transparent; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }
    .btn-outline { background: #fff; color: #334155; border-color: #cbd5e1; }
    .btn-outline:hover { background: #f8fafc; }
    .btn-ghost { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.4); }
    .btn-ghost:hover { background: rgba(255,255,255,.25); }
    .btn-sm { display: inline-block; width: auto; padding: 8px 14px; font-size: 13px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input[type=text], input[type=password], input[type=email], input[type=date],
    input[type=number], select, textarea {
      width: 100%; padding: 11px 12px; font: inherit; color: #1e293b; background: #fff;
      border: 1px solid #cbd5e1; border-radius: 10px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, .2);
    }
    .err { color: #dc2626; font-size: 12px; margin-top: 4px; }
    .alert { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 12px;
             border-radius: 10px; font-size: 13px; margin-bottom: 16px; }
    .alert.ok { background: #f0fdf4; color: #15803d; border-color: #bbf7d0; }

    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
              max-width: 1200px; margin: 0 auto 20px; color: #fff; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .actions { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .actions form { margin: 0; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
